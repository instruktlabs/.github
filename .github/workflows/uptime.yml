name: Uptime

# Daily check that every public site, sitemap and health endpoint answers.
# On failure it opens (or comments on) one "Uptime check failing" issue; on recovery it closes it.

on:
  schedule:
    - cron: "17 13 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: uptime
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Probe sites
        id: probe
        shell: bash
        run: |
          set -u
          urls=(
            https://kilnstudio.tools/
            https://kilnstudio.tools/sitemap.xml
            https://holodeck.kilnstudio.tools/
            https://holodeck.kilnstudio.tools/sitemap.xml
            https://sheepdogsim.com/
            https://sheepdogsim.com/sitemap.xml
            https://sheepdogsim.com/api/healthz
            https://objekt62.com/
            https://objekt62.com/sitemap.xml
            https://objekt62.com/api/health
            https://skisim.app/
            https://skisim.app/sitemap.xml
            https://kiln.instruktlabs.com/
          )
          failed=()
          for url in "${urls[@]}"; do
            code=""
            for attempt in 1 2 3; do
              code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -A 'instruktlabs-uptime/1.0 (+https://github.com/instruktlabs/.github)' "$url" || echo 000)
              [ "$code" = "200" ] && break
              sleep 10
            done
            echo "$code $url"
            [ "$code" = "200" ] || failed+=("$code $url")
          done
          {
            echo "failed<<EOF"
            printf '%s\n' "${failed[@]:-}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          [ ${#failed[@]} -eq 0 ]

      - name: Open or update issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED: ${{ steps.probe.outputs.failed }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf 'Failing after 3 attempts:\n\n```\n%s\n```\n\nRun: %s' "$FAILED" "$RUN_URL")
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Uptime check failing"' --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" -R "$GITHUB_REPOSITORY" --body "$body"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "Uptime check failing" --body "$body"
          fi

      - name: Close issue on recovery
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          num=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search 'in:title "Uptime check failing"' --json number --jq '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue close "$num" -R "$GITHUB_REPOSITORY" --comment "All checks passing again: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          fi
